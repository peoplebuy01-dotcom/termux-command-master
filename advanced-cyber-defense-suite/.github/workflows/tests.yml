name: TAT Pro tests

on:
  push:
    paths:
      - "advanced-cyber-defense-suite/**"
  pull_request:
    paths:
      - "advanced-cyber-defense-suite/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advanced-cyber-defense-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python tat.py --help
